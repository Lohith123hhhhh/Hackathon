<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        html, body {
            display: grid;
            height: 100%;
            width: 100%;
            place-items: center;
            background: url("https://images3.alphacoders.com/830/thumb-1920-83067.jpg") no-repeat;
            background-position: center;
            background-size: cover;
        }

        .wrapper {
    overflow: hidden;
    max-width: 450px; 
    background: transparent;
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 15px; 
    box-shadow: 0 0 25px #7B1FA2; 
}


        .title-text {
            display: flex;
            width: 200%;
        }

        .title {
            width: 100%;
            font-size: 35px;
            font-weight: 600;
            text-align: center;
            color: #fff;
        }

        .slide-controls {
            position: relative;
            display: flex;
            height: 50px;
            width: 100%;
            overflow: hidden;
            margin: 30px 0 10px 0;
            justify-content: center;
            border: 1px solid rgb(52, 43, 43);
            border-radius: 5px;
        }

        .slide {
            height: 100%;
            width: 100%;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            line-height: 48px;
            cursor: pointer;
            z-index: 1;
            transition: all 0.6 ease;
        }

        .slider-tab {
            position: absolute;
            height: 100%;
            width: 100%;
            left: 0;
            z-index: 0;
            border-radius: 5px;
            background: -webkit-linear-gradient(left, #d33fc7, #4a9ee2);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .form-container {
            width: 100%;
            overflow: hidden;
        }

        .form-inner {
            display: flex;
            width: 100%;
            transition: all 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
        }

        .form-inner form {
            width: 100%;
        }

        .field {
            height: 50px;
            width: 100%;
            margin-top: 20px;
        }

        .field input {
            height: 100%;
            width: 100%;
            outline: none;
            padding-left: 15px;
            border-radius: 5px;
            border: 1px solid lightgrey;
            border-bottom-width: 2px;
            font-size: 17px;
            transition: all 0.3s ease;
        }

        .field input:focus {
            border-color: #3012f0;
        }

        .pass-link {
            margin-top: 5px;
            text-align: center;
        }

        .pass-link a {
            text-decoration: none;
            color: rgb(188,85,192);
            font-weight: bold;
        }

        .btn {
            height: 50px;
            width: 100%;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .btn input[type="submit"] {
            height: 100%;
            width: 100%;
            z-index: 2;
            position: relative;
            background: -webkit-linear-gradient(right, #d33fc7, #4a9ee2);
            border: none;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover input[type="submit"] {
            background: #4a9ee2;
        }

    </style>
</head>
<body>
    <div class="wrapper">
        <div class="form-container">
            <div class="slide-controls">
                <label class="slide">Admin Login</label>
                <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
                <form id="adminLoginForm">
                    <div class="field">
                        <input type="text" id="adminUserID" placeholder="User ID" required>
                    </div>
                    <div class="field">
                        <input type="password" id="adminPassword" placeholder="Password" required>
                    </div>
                    <div class="field btn">
                        <input type="submit" value="Login">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();
    
            const userID = document.getElementById("adminUserID").value;
            const password = document.getElementById("adminPassword").value;

            const adminUserID = "admin";
            const adminPassword = "password123"; 
    
            if (userID === adminUserID && password === adminPassword) {
                alert("Login Successful!");
                window.location.href = "admin-dashboard.html"; 
            } else {
                alert("Invalid Credentials! Please try again.");
            }
        });
    </script>
    
</body>
</html>
