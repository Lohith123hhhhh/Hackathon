<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrapper">
        <div class="title-text">
            <div class="title login"><h2>LOG IN / S</h2></div>
            <div class="title signup"><h2>IGN UP</h2></div>
        </div>
        <div class="form-container">
            <div class="slide-controls">
                <input type="radio" name="slide" id="login" checked>
                <input type="radio" name="slide" id="signup">
                <label for="login" class="slide login">Login</label>
                <label for="signup" class="slide signup">Signup</label>
                <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
                <form id="loginForm" class="login">
                    <div class="field">
                        <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="off">
                    </div>
                    <div class="field">
                        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="off">
                    </div>
                    <div class="pass-link">
                        <a href="#">Reset Password?</a>
                    </div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Login">
                    </div>
                    <div class="signup-link">
                        Don't Have an Account? <a href="#">Create A New</a>
                    </div>
                </form>
                
                <form id="signupForm" class="signup">
                    <div class="field">
                        <input type="email" id="signupEmail" placeholder="Email Address" required autocomplete="off">
                    </div>
                    <div class="field">
                        <input type="password" id="signupPassword" placeholder="Password" required autocomplete="off">
                    </div>
                    
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Sign Up">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
