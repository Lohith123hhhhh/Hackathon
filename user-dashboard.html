<div class="container">

    <aside class="sidebar">
        <h3>View Events</h3>
        <ul>
            <li>
                <a href="#" onclick="loadEvents('live')">Live Events</a>
            </li>
        </ul>
    </aside>

    <main class="content-frame">
        <h2>Live Events</h2>
        <div id="eventDetails" class="event-grid"></div>
        <div id="feedbackForm" class="feedback-form" style="display: none;">
            <h3>Event Feedback</h3>
            <textarea id="comment" placeholder="Write your review..."></textarea>
            <label>Rating:</label>
            <select id="rating">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <label>Upload Image:</label>
            <input type="file" id="imageUpload" accept="image/*">
            <button onclick="submitFeedback()">Submit</button>
        </div>
    </main>
</div>
